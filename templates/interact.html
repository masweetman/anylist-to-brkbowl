<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            background: #3949ab;
            color: white;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #item-info { flex: 1; min-width: 0; }
        #item-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
        #item-name  { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #progress   { font-size: 12px; opacity: 0.7; white-space: nowrap; flex-shrink: 0; }

        .tbtn {
            border: none; padding: 9px 16px; border-radius: 4px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: filter 0.15s; flex-shrink: 0;
        }
        .tbtn:hover    { filter: brightness(1.1); }
        .tbtn:disabled { opacity: 0.5; cursor: default; filter: none; }
        #added-btn  { background: #43a047; color: white; }
        #skip-btn   { background: rgba(255,255,255,0.18); color: white; }
        #cancel-btn { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); }

        #site-frame {
            flex: 1;
            border: none;
            width: 100%;
        }

        #loading-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #f5f5f5;
            color: #555;
            font-size: 15px;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #ddd;
            border-top-color: #3949ab;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #completion-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            gap: 14px;
            text-align: center;
            padding: 40px;
        }
        #completion-screen h1 { font-size: 26px; color: #333; }
        #completion-screen p  { color: #666; font-size: 14px; }
        #return-btn {
            background: #3949ab; color: white; border: none;
            padding: 11px 26px; border-radius: 4px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #return-btn:hover { background: #303f9f; }

        #error-toast {
            display: none;
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: #d32f2f; color: white;
            padding: 10px 18px; border-radius: 4px;
            font-size: 13px; z-index: 100;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        /* iOS fallback panel (replaces iframe — iOS blocks 3rd-party cookies in iframes) */
        #ios-panel {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            padding: 32px 24px;
            text-align: center;
            gap: 18px;
        }
        #ios-panel .ios-hint {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        #open-shop-btn {
            display: inline-block;
            background: #3949ab;
            color: white;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="toolbar" style="display:none">
        <div id="item-info">
            <div id="item-label">Shopping for</div>
            <div id="item-name"></div>
        </div>
        <div id="progress"></div>
        <button class="tbtn" id="skip-btn">Skip</button>
        <button class="tbtn" id="added-btn">&#10003; Added to Cart</button>
        <button class="tbtn" id="cancel-btn">&#10005; Cancel</button>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div>Loading...</div>
    </div>

    <iframe id="site-frame" title="Berkeley Bowl" style="display:none"></iframe>

    <!-- Shown instead of iframe on iOS where 3rd-party cookies are blocked -->
    <div id="ios-panel">
        <a id="open-shop-btn" href="#" target="_blank">Open Shop &#8594;</a>
        <p class="ios-hint">After adding the item to your cart,<br>come back here and tap <strong>&#10003; Added to Cart</strong>.</p>
    </div>

    <div id="completion-screen">
        <h1>&#10003; All Done!</h1>
        <p>All items have been processed.</p>
        <button id="return-btn" onclick="window.location.href='/'">Return to Shopping List</button>
    </div>

    <div id="error-toast"></div>

    <script>
        const HEARTBEAT_INTERVAL = 5000;
        let sessionId = null;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            sessionId = params.get('session_id');
            if (!sessionId) { showError('No session ID provided'); return; }
            startHeartbeat();
            loadItem();
        }

        function showError(msg) {
            const t = document.getElementById('error-toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 5000);
        }

        function startHeartbeat() {
            setInterval(async () => {
                try { await fetch(`/api/interact/heartbeat/${sessionId}`, { method: 'POST' }); }
                catch (e) {}
            }, HEARTBEAT_INTERVAL);
        }

        async function loadItem() {
            showView('loading-screen');
            try {
                const res = await fetch(`/api/interact/status/${sessionId}`);
                if (res.status === 404) { showError('Session expired or not found'); return; }
                if (!res.ok) throw new Error(`Status ${res.status}`);
                const status = await res.json();

                if (status.status === 'complete') {
                    showView('completion-screen');
                    return;
                }

                const item = status.item;
                const url = status.status === 'ready'
                    ? status.url
                    : `https://shop.heinzcatering.berkeleybowl.com/search?filter%5Betext%5D=${btoa(unescape(encodeURIComponent(status.search_query)))}&filter%5Bwidget%5D=1`;

                document.getElementById('item-name').textContent = item.name;
                document.getElementById('progress').textContent = `${status.item_number} / ${status.total_items}`;

                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                if (isIOS) {
                    document.getElementById('open-shop-btn').href = url;
                    showView('ios-panel');
                } else {
                    const frame = document.getElementById('site-frame');
                    frame.src = url;
                    showView('site-frame');
                }

                const addedBtn = document.getElementById('added-btn');
                const skipBtn  = document.getElementById('skip-btn');
                addedBtn.disabled = false;
                skipBtn.disabled  = false;

                const done = async (skipped) => {
                    addedBtn.disabled = true;
                    skipBtn.disabled  = true;

                    if (skipped) {
                        await fetch(`/api/interact/item-skip/${sessionId}`, { method: 'POST' });
                    } else {
                        // Try to capture canonical URL from iframe (desktop only; cross-origin blocked on iOS)
                        let productUrl = url;
                        try {
                            const frame = document.getElementById('site-frame');
                            const canonical = frame.contentDocument.querySelector('link[rel="canonical"]');
                            if (canonical && canonical.href && canonical.href.includes('/product')) {
                                productUrl = canonical.href;
                            }
                        } catch (e) { /* cross-origin blocked – use initial url */ }

                        await fetch(`/api/interact/item-complete/${sessionId}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ item_id: item.id, product_url: productUrl, cart_count_changed: true })
                        });
                    }

                    // Reload this page to fetch the next item
                    window.location.href = `/interact?session_id=${sessionId}`;
                };

                addedBtn.onclick = () => done(false);
                skipBtn.onclick  = () => done(true);
                document.getElementById('cancel-btn').onclick = () => { window.close(); };

                document.getElementById('toolbar').style.display = 'flex';

            } catch (e) {
                showError('Error: ' + e.message);
            }
        }

        function showView(id) {
            ['loading-screen', 'site-frame', 'ios-panel', 'completion-screen'].forEach(v => {
                const el = document.getElementById(v);
                if (!el) return;
                if (v === id) {
                    el.style.display = (v === 'site-frame') ? 'block' : 'flex';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
