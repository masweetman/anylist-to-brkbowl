<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            background: #3949ab;
            color: white;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #item-info { flex: 1; min-width: 0; }
        #item-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
        #item-name  { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #progress   { font-size: 12px; opacity: 0.7; white-space: nowrap; flex-shrink: 0; }

        .tbtn {
            border: none; padding: 9px 16px; border-radius: 4px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: filter 0.15s; flex-shrink: 0;
        }
        .tbtn:hover    { filter: brightness(1.1); }
        .tbtn:disabled { opacity: 0.5; cursor: default; filter: none; }
        #added-btn  { background: #43a047; color: white; }
        #skip-btn   { background: rgba(255,255,255,0.18); color: white; }
        #cancel-btn { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); }

        #loading-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #f5f5f5;
            color: #555;
            font-size: 15px;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #ddd;
            border-top-color: #3949ab;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #completion-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            gap: 14px;
            text-align: center;
            padding: 40px;
        }
        #completion-screen h1 { font-size: 26px; color: #333; }
        #completion-screen p  { color: #666; font-size: 14px; }
        #return-btn {
            background: #3949ab; color: white; border: none;
            padding: 11px 26px; border-radius: 4px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #return-btn:hover { background: #303f9f; }

        #error-toast {
            display: none;
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: #d32f2f; color: white;
            padding: 10px 18px; border-radius: 4px;
            font-size: 13px; z-index: 100;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        #shop-panel {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #f5f5f5;
            padding: 30px;
            text-align: center;
        }
        #shop-panel p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            max-width: 320px;
        }
        #open-shop-btn {
            background: #3949ab;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        #open-shop-btn:hover { background: #303f9f; }
    </style>
</head>
<body>

    <div id="toolbar" style="display:none">
        <div id="item-info">
            <div id="item-label">Shopping for</div>
            <div id="item-name"></div>
        </div>
        <div id="progress"></div>
        <button class="tbtn" id="skip-btn">Skip</button>
        <button class="tbtn" id="added-btn">&#10003; Added to Cart</button>
        <button class="tbtn" id="cancel-btn">&#10005; Cancel</button>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div>Loading...</div>
    </div>

    <div id="completion-screen">
        <h1>&#10003; All Done!</h1>
        <p>All items have been processed.</p>
        <button id="return-btn" onclick="window.location.href='/'">Return to Shopping List</button>
    </div>

    <div id="shop-panel">
        <p id="shop-msg">Tap below to open the shop, then switch between tabs to search and add items.</p>
        <button id="open-shop-btn">Open Berkeley Bowl Shop</button>
    </div>

    <div id="error-toast"></div>

    <script>
        const HEARTBEAT_INTERVAL = 5000;
        let sessionId = null;
        let shopWindow = null;
        let currentItemUrl = null;
        let currentItem = null;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            sessionId = params.get('session_id');
            if (!sessionId) { showError('No session ID provided'); return; }

            document.getElementById('open-shop-btn').addEventListener('click', () => {
                if (currentItemUrl) {
                    shopWindow = window.open(currentItemUrl, 'berkeleybowl');
                    document.getElementById('shop-msg').textContent =
                        'Shop is open in another tab. Switch to it to search, then come back here to advance.';
                    document.getElementById('open-shop-btn').textContent = 'Re-open Shop';
                }
            });

            startHeartbeat();
            loadItem();
        }

        function showError(msg) {
            const t = document.getElementById('error-toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 5000);
        }

        function startHeartbeat() {
            setInterval(async () => {
                try { await fetch(`/api/interact/heartbeat/${sessionId}`, { method: 'POST' }); }
                catch (e) {}
            }, HEARTBEAT_INTERVAL);
        }

        async function loadItem() {
            showView('loading-screen');
            try {
                const res = await fetch(`/api/interact/status/${sessionId}`);
                if (res.status === 404) { showError('Session expired or not found'); return; }
                if (!res.ok) throw new Error(`Status ${res.status}`);
                const status = await res.json();

                if (status.status === 'complete') {
                    if (shopWindow && !shopWindow.closed) shopWindow.close();
                    document.getElementById('toolbar').style.display = 'none';
                    showView('completion-screen');
                    return;
                }

                const item = status.item;
                currentItem = item;
                const url = status.status === 'ready'
                    ? status.url
                    : `https://shop.berkeleybowl.com/search/?item=${encodeURIComponent(status.search_query)}`;
                currentItemUrl = url;

                document.getElementById('item-name').textContent = item.name;
                document.getElementById('progress').textContent = `${status.item_number} / ${status.total_items}`;

                if (shopWindow && !shopWindow.closed) {
                    try { shopWindow.location.href = url; } catch (e) { /* cross-origin nav failed */ }
                    document.getElementById('shop-msg').textContent =
                        'Shop tab updated with the next item. Switch to it to search.';
                    document.getElementById('open-shop-btn').textContent = 'Re-open Shop';
                } else {
                    document.getElementById('shop-msg').textContent =
                        'Tap below to open the shop, then switch between tabs to search and add items.';
                    document.getElementById('open-shop-btn').textContent = 'Open Berkeley Bowl Shop';
                }
                showView('shop-panel');

                const addedBtn = document.getElementById('added-btn');
                const skipBtn  = document.getElementById('skip-btn');
                addedBtn.disabled = false;
                skipBtn.disabled  = false;

                addedBtn.onclick = async () => {
                    addedBtn.disabled = true;
                    skipBtn.disabled  = true;

                    await fetch(`/api/interact/item-complete/${sessionId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ item_id: currentItem.id, product_url: currentItemUrl, cart_count_changed: true })
                    });

                    loadItem();
                };

                skipBtn.onclick = async () => {
                    addedBtn.disabled = true;
                    skipBtn.disabled  = true;
                    await fetch(`/api/interact/item-skip/${sessionId}`, { method: 'POST' });
                    loadItem();
                };

                document.getElementById('cancel-btn').onclick = () => {
                    if (shopWindow && !shopWindow.closed) shopWindow.close();
                    window.close();
                };

                document.getElementById('toolbar').style.display = 'flex';

            } catch (e) {
                showError('Error: ' + e.message);
            }
        }

        function showView(id) {
            ['loading-screen', 'completion-screen', 'shop-panel'].forEach(v => {
                const el = document.getElementById(v);
                if (!el) return;
                if (v === id) {
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
