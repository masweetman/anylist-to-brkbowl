<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shopping List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 24px;
            text-align: center;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 14px;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #3949ab;
        }
        button[type="submit"] {
            width: 100%;
            padding: 11px;
            background: #3949ab;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button[type="submit"]:hover { background: #303f9f; }
        .error {
            color: #d32f2f;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
        }
        .forgot-password {
            margin-top: 20px;
            text-align: center;
        }
        .forgot-password a {
            font-size: 13px;
            color: #888;
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-password a:hover { color: #555; text-decoration: underline; }

        /* Reset confirmation dialog */
        #reset-dialog {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #fff3e0;
            border: 1px solid #ffb74d;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
        }
        #reset-dialog p { margin-bottom: 12px; line-height: 1.5; }
        #reset-dialog strong { color: #d32f2f; }
        .reset-actions { display: flex; gap: 8px; }
        .btn-reset-confirm {
            flex: 1;
            padding: 9px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset-confirm:hover { background: #b71c1c; }
        .btn-reset-cancel {
            flex: 1;
            padding: 9px;
            background: #eee;
            color: #333;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-reset-cancel:hover { background: #ddd; }
        #reset-success {
            display: none;
            margin-top: 14px;
            color: #2e7d32;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Shopping List</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
            <button type="submit">Sign in</button>
        </form>

        <div class="forgot-password">
            <a id="forgot-link" href="#">Forgot password?</a>
        </div>

        <div id="reset-dialog">
            <p>
                <strong>Warning:</strong> This will permanently delete all shopping list
                items and clear your AnyList credentials and password.
                You will be able to set a new password afterwards.
            </p>
            <div class="reset-actions">
                <button class="btn-reset-confirm" id="btn-reset-confirm">Reset everything</button>
                <button class="btn-reset-cancel" id="btn-reset-cancel">Cancel</button>
            </div>
        </div>

        <div id="reset-success">
            ✅ App has been reset. <a href="/">Go to shopping list</a>
        </div>
    </div>

    <script>
        document.getElementById('forgot-link').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('reset-dialog').style.display = 'block';
            this.style.display = 'none';
        });

        document.getElementById('btn-reset-cancel').addEventListener('click', function() {
            document.getElementById('reset-dialog').style.display = 'none';
            document.getElementById('forgot-link').style.display = '';
        });

        document.getElementById('btn-reset-confirm').addEventListener('click', function() {
            var btn = this;
            btn.disabled = true;
            btn.textContent = 'Resetting…';

            fetch('/api/reset', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        document.getElementById('reset-dialog').style.display = 'none';
                        document.getElementById('reset-success').style.display = 'block';
                    } else {
                        btn.disabled = false;
                        btn.textContent = 'Reset everything';
                        alert('Reset failed: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(function(err) {
                    btn.disabled = false;
                    btn.textContent = 'Reset everything';
                    alert('Reset failed: ' + err);
                });
        });
    </script>
</body>
</html>
